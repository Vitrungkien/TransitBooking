<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransitBooking - Đặt Xe Khách & Xe Ghép Tiện Lợi</title>

    <!-- CSS Dependencies -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/4.6.2/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/lib/toastr.min.css}" />
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">

    <style>
        :root {
            --primary-blue: #2474E5;
            --accent-yellow: #FFD333;
        }

        body {
            background: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Layout Improvements */
        .page-wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .main-content {
            flex: 1;
            padding: 40px 0;
        }

        /* Sidebar Styling */
        .sidebar-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: 0.3s;
        }

        .sidebar-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        }

        .sidebar-header {
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 12px;
            color: var(--primary-blue);
            font-weight: 700;
        }

        /* Search Box Overrides */
        .hero-search {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
            padding: 30px;
            margin-bottom: 40px;
        }

        .search-field {
            border-radius: 10px;
            border: 1px solid #e0e0e0;
            height: 50px;
            font-weight: 500;
        }

        .search-field:focus {
            box-shadow: 0 0 0 3px rgba(36, 116, 229, 0.2);
            border-color: var(--primary-blue);
        }

        .btn-search {
            border-radius: 10px;
            height: 50px;
            background: var(--accent-yellow);
            color: black;
            font-weight: 700;
            font-size: 1.1rem;
            transition: 0.2s;
            border: none;
        }

        .btn-search:hover {
            background: #e6be2e;
            transform: scale(1.02);
        }

        /* Custom Animations */
        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.6;
            }

            100% {
                opacity: 1;
            }
        }

        .animate-pulse {
            animation: pulse 1.5s infinite;
        }

        /* Scrollbar */
        #nha-xe::-webkit-scrollbar,
        #all-notice::-webkit-scrollbar {
            width: 5px;
        }

        #nha-xe::-webkit-scrollbar-thumb,
        #all-notice::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 10px;
        }
    </style>
</head>

<body class="page-wrapper">
    <!-- Fragments Integration -->
    <div th:replace="~{fragments/header}"></div>

    <main class="main-content">
        <div class="container">
            <div class="row">
                <!-- Sidebar: Store List -->
                <aside class="col-lg-3 d-none d-lg-block">
                    <div class="card sidebar-card mb-4 p-4 sticky-top" style="top: 20px;">
                        <h5 class="sidebar-header mb-4 text-uppercase">Nhà xe uy tín</h5>
                        <div id="nha-xe" style="max-height: 60vh; overflow-y: auto;">
                            <!-- Dynamically loaded -->
                        </div>
                    </div>
                </aside>

                <!-- Center Content: Search & Tickets -->
                <section class="col-lg-6 col-md-12 px-md-4">
                    <!-- Hero Search Area -->
                    <div class="hero-search">
                        <h4 class="mb-4 font-weight-bold">Tìm kiếm chuyến xe</h4>
                        <form th:action="@{/search-by-stop}" th:object="${searchForm}" method="get">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="small font-weight-bold text-muted">ĐIỂM ĐI</label>
                                    <div class="input-group">
                                        <div class="input-group-prepend"><span
                                                class="input-group-text bg-white border-right-0"><i
                                                    class="fas fa-map-marker-alt text-primary"></i></span></div>
                                        <input type="text" class="form-control border-left-0 search-field"
                                            th:field="*{startAddress}" placeholder="Hà Nội, Vĩnh Phúc..." required />
                                    </div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="small font-weight-bold text-muted">ĐIỂM ĐẾN</label>
                                    <div class="input-group">
                                        <div class="input-group-prepend"><span
                                                class="input-group-text bg-white border-right-0"><i
                                                    class="fas fa-location-arrow text-success"></i></span></div>
                                        <input type="text" class="form-control border-left-0 search-field"
                                            th:field="*{endAddress}" placeholder="Tuyên Quang, Thái Nguyên..."
                                            required />
                                    </div>
                                </div>
                                <div class="col-md-12 mb-4">
                                    <label class="small font-weight-bold text-muted">GIỜ KHỞI HÀNH (TÙY CHỌN)</label>
                                    <input type="time" class="form-control search-field" th:field="*{startTime1}" />
                                </div>
                            </div>
                            <button type="submit" class="btn btn-search btn-block shadow-sm">TÌM VÉ NGAY</button>
                        </form>
                    </div>

                    <!-- Ticket List Section -->
                    <div id="results-headline" class="d-flex justify-content-between align-items-center mb-4">
                        <h5 class="mb-0 font-weight-bold">Chuyến xe sẵn có</h5>
                        <div class="dropdown">
                            <button class="btn btn-sm btn-light border dropdown-toggle" type="button">Sắp xếp: Mặc
                                định</button>
                        </div>
                    </div>

                    <div id="productList">
                        <!-- Loading State -->
                        <div class="text-center p-5">
                            <div class="spinner-grow text-primary" role="status"></div>
                            <p class="mt-3 text-muted">Đang tìm các chuyến xe tốt nhất cho bạn...</p>
                        </div>
                    </div>

                    <div id="pagination" class="mt-5 mb-5 text-center"></div>
                </section>

                <!-- Sidebar: Notifications -->
                <aside class="col-lg-3 d-none d-lg-block">
                    <div class="card sidebar-card mb-4 p-4 sticky-top" style="top: 20px;">
                        <h5 class="sidebar-header mb-4 text-uppercase">Thông báo mới</h5>
                        <div id="all-notice" style="max-height: 60vh;">
                            <!-- Dynamically loaded -->
                        </div>
                    </div>
                </aside>
            </div>
        </div>
    </main>

    <footer class="bg-white border-top py-5 text-center">
        <div class="container">
            <p class="mb-0 text-muted font-weight-bold">TransitBooking &copy; 2023 - Đồ án tốt nghiệp Vi Trung Kiên</p>
            <small class="text-muted">B19DCVT195 - Học viện Công nghệ Bưu chính Viễn thông</small>
        </div>
    </footer>

    <!-- Global Scripts -->
    <div th:replace="~{fragments/common-scripts :: commonScripts}"></div>
    <script th:src="@{/js/main.js}"></script>
    <script th:src="@{/webjars/bootstrap/4.6.2/js/bootstrap.bundle.min.js}"></script>
</body>

</html>
