<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thêm Vé Xe Mới - TransitBooking</title>

  <link rel="stylesheet" th:href="@{/webjars/bootstrap/4.6.2/css/bootstrap.min.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.0/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/admin.css}">
  <link rel="stylesheet" th:href="@{/css/header.css}">

  <style>
    .form-section {
      background: white;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
      margin-bottom: 25px;
    }

    .section-title {
      font-weight: 700;
      color: var(--primary);
      border-left: 4px solid var(--primary);
      padding-left: 15px;
      margin-bottom: 20px;
    }

    .stop-item {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 10px;
      border: 1px solid #eee;
    }

    .ck-editor__editable {
      min-height: 200px;
    }
  </style>
</head>

<body>
  <div th:replace="~{fragments/header}"></div>

  <div class="dashboard-wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar('products')}"></div>

    <main class="main-content">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="font-weight-bold mb-0">Thêm Vé Xe Mới</h2>
          <p class="text-muted mb-0">Tạo chuyến xe ghép hoặc xe khách chất lượng cao</p>
        </div>
        <a th:href="@{/management}" class="btn btn-light"><i class="fas fa-arrow-left mr-2"></i> QUAY LẠI</a>
      </div>

      <form action="/management/my-store/add-product" method="post">
        <div class="row">
          <div class="col-lg-8">
            <!-- Basic Info -->
            <div class="form-section">
              <h5 class="section-title">THÔNG TIN CHUNG</h5>
              <div class="form-group">
                <label>Tên chuyến xe (Tuyến đường)</label>
                <input type="text" name="productName" class="form-control" placeholder="Ví dụ: Hà Nội - Lạng Sơn"
                  required>
              </div>
              <div class="row">
                <div class="col-md-6">
                  <div class="form-group"><label>Loại xe</label><input type="text" name="type" class="form-control"
                      placeholder="Ví dụ: Limousine 9 chỗ" required></div>
                </div>
                <div class="col-md-6">
                  <div class="form-group"><label>Biển số</label><input type="text" name="bienSoXe" class="form-control"
                      placeholder="29A-12345"></div>
                </div>
              </div>
              <div class="row">
                <div class="col-md-4">
                  <div class="form-group"><label>Giá vé (VNĐ)</label><input type="number" name="price"
                      class="form-control" placeholder="200000" required></div>
                </div>
                <div class="col-md-4">
                  <div class="form-group"><label>Chỗ trống</label><input type="number" name="remainSeat"
                      class="form-control" placeholder="9" required></div>
                </div>
                <div class="col-md-4">
                  <div class="form-group"><label>Hình ảnh (URL)</label><input type="text" name="productImage"
                      class="form-control" placeholder="https://..."></div>
                </div>
              </div>
              <div class="row">
                <div class="col-md-6">
                  <div class="form-group"><label>SĐT 1</label><input type="text" name="phoneNumber" class="form-control"
                      placeholder="Số điện thoại chính" required></div>
                </div>
                <div class="col-md-6">
                  <div class="form-group"><label>SĐT 2</label><input type="text" name="phoneNumber2"
                      class="form-control" placeholder="Số điện thoại phụ"></div>
                </div>
              </div>
            </div>

            <!-- Route Info -->
            <div class="form-section">
              <h5 class="section-title">LỊCH TRÌNH CHÍNH</h5>
              <div class="row">
                <div class="col-md-6">
                  <div class="form-group"><label>Điểm bắt đầu</label><input type="text" name="startAddress"
                      class="form-control" placeholder="Điểm đón đầu tiên" required></div>
                  <div class="form-group"><label>Giờ xuất phát</label><input type="time" name="startTime"
                      class="form-control" required></div>
                </div>
                <div class="col-md-6">
                  <div class="form-group"><label>Điểm kết thúc</label><input type="text" name="endAddress"
                      class="form-control" placeholder="Bến xe/Điểm trả cuối" required></div>
                  <div class="form-group"><label>Giờ đến dự kiến</label><input type="time" name="endTime"
                      class="form-control"></div>
                </div>
              </div>
            </div>

            <!-- Detailed Stops -->
            <div class="form-section">
              <h5 class="section-title">ĐIỂM DỪNG TIẾP NHẬN</h5>
              <div id="stopList"></div>
              <button type="button" class="btn btn-outline-primary btn-block mt-3" onclick="addStop()"><i
                  class="fas fa-plus mr-2"></i> THÊM ĐIỂM DỪNG</button>
            </div>
          </div>

          <div class="col-lg-4">
            <!-- Content -->
            <div class="form-section">
              <h5 class="section-title">NỘI DUNG CHI TIẾT</h5>
              <div class="form-group"><label>Mô tả chuyến xe</label><textarea id="descEditor"
                  name="description"></textarea></div>
              <div class="form-group"><label>Chính sách</label><textarea id="policyEditor" name="policy"></textarea>
              </div>
              <div class="form-group"><label>Tiện ích</label><textarea id="utilEditor" name="tienIch"></textarea></div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg btn-block shadow-sm py-3 font-weight-bold">ĐĂNG CHUYẾN
              XE</button>
            <a th:href="@{/management}" class="btn btn-light btn-block mt-3">HỦY BỎ</a>
          </div>
        </div>
      </form>
    </main>
  </div>

  <div th:replace="~{fragments/common-scripts :: commonScripts}"></div>
  <script src="https://cdn.ckeditor.com/ckeditor5/40.2.0/classic/ckeditor.js"></script>

  <script th:inline="javascript">
    let stopCount = 0;

    $(document).ready(function () {
      // Init Editors
      ClassicEditor.create(document.querySelector('#descEditor')).catch(console.error);
      ClassicEditor.create(document.querySelector('#policyEditor')).catch(console.error);
      ClassicEditor.create(document.querySelector('#utilEditor')).catch(console.error);

      // Add first empty stop
      addStop();
    });

    function addStop() {
      const stopList = $('#stopList');
      const id = stopCount++;
      const stopHtml = `
                <div class="stop-item" id="stop-at-${id}">
                    <div class="row align-items-end">
                        <div class="col-md-7">
                            <label class="small font-weight-bold text-muted uppercase">Địa chỉ dừng</label>
                            <input type="text" name="stopList[${id}].stopAddress" class="form-control form-control-sm" placeholder="Ví dụ: Cổng chào Phù Ninh" required>
                        </div>
                        <div class="col-md-3">
                            <label class="small font-weight-bold text-muted uppercase">Giờ</label>
                            <input type="time" name="stopList[${id}].stopTime" class="form-control form-control-sm" required>
                        </div>
                        <div class="col-md-2 text-right">
                            <button type="button" class="btn btn-sm btn-outline-danger" onclick="removeStop(${id})"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                </div>
            `;
      stopList.append(stopHtml);
    }

    function removeStop(id) {
      $(`#stop-at-${id}`).remove();
      // Optional: re-index if collection binding strictness requires it, but with Spring Boot's List binding, simple removal usually works.
    }
  </script>
</body>

</html>
