<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Đơn hàng - TransitBooking</title>

  <link rel="stylesheet" th:href="@{/webjars/bootstrap/4.6.2/css/bootstrap.min.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.0/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/admin.css}">
  <link rel="stylesheet" th:href="@{/css/header.css}">

  <style>
    .status-badge {
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
    }

    .status-pending {
      background: #fffbe6;
      color: #faad14;
      border: 1px solid #ffe58f;
    }

    .status-confirmed {
      background: #e6f7ff;
      color: #1890ff;
      border: 1px solid #91d5ff;
    }

    .status-completed {
      background: #f6ffed;
      color: #52c41a;
      border: 1px solid #b7eb8f;
    }

    .status-cancelled {
      background: #fff1f0;
      color: #f5222d;
      border: 1px solid #ffa39e;
    }

    .order-id {
      font-family: monospace;
      font-weight: 700;
      color: var(--primary);
    }

    .customer-info {
      font-size: 0.85rem;
    }

    .price-text {
      font-weight: 700;
      color: var(--danger);
    }

    .frmDatVe-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1100;
    }
  </style>
</head>

<body>
  <div th:replace="~{fragments/header}"></div>

  <div class="dashboard-wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar('orders')}"></div>

    <main class="main-content">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="font-weight-bold mb-0">Quản lý Đơn hàng</h2>
          <p class="text-muted mb-0">Xử lý yêu cầu đặt chỗ từ khách hàng</p>
        </div>
      </div>

      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon" style="background: rgba(24, 144, 255, 0.1); color: #1890ff;"><i
              class="fas fa-shopping-bag"></i></div>
          <div class="stat-info">
            <h3 id="stat-total">0</h3>
            <p>Tổng đơn hàng</p>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon" style="background: rgba(250, 173, 20, 0.1); color: #faad14;"><i
              class="fas fa-clock"></i></div>
          <div class="stat-info">
            <h3 id="stat-pending">0</h3>
            <p>Chờ xác nhận</p>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon" style="background: rgba(82, 196, 26, 0.1); color: #52c41a;"><i
              class="fas fa-check-double"></i></div>
          <div class="stat-info">
            <h3 id="stat-completed">0</h3>
            <p>Hoàn thành</p>
          </div>
        </div>
      </div>

      <div class="content-card">
        <div class="card-header">
          <h5 class="card-title">Danh sách giao dịch</h5>
        </div>
        <div class="table-responsive">
          <table class="table" id="tb-order">
            <thead>
              <tr>
                <th>STT</th>
                <th>Mã đơn</th>
                <th>Khách hàng</th>
                <th>Thông tin vé</th>
                <th>Thanh toán</th>
                <th>Trạng thái</th>
                <th>Thao tác</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td colspan="7" class="text-center py-5">
                  <div class="spinner-border text-primary mb-2"></div>
                  <p class="text-muted">Đang tải danh sách đơn hàng...</p>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div th:replace="~{fragments/common-scripts :: commonScripts}"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

  <script th:inline="javascript">
    $(document).ready(function () {
      loadOrders();
    });

    function loadOrders() {
      ApiService.get('/api/v1/seller/my-store/all-order')
        .then(orders => {
          renderOrders(orders);
          updateStats(orders);
        })
        .catch(err => {
          console.error(err);
          $('#tb-order tbody').html('<tr><td colspan="7" class="text-center p-5 text-danger">Lỗi tải dữ liệu.</td></tr>');
        });
    }

    function updateStats(orders) {
      $('#stat-total').text(orders.length);
      $('#stat-pending').text(orders.filter(o => o.orderStatus === 'Chờ xác nhận').length);
      $('#stat-completed').text(orders.filter(o => o.orderStatus === 'Đã hoàn thành').length);
    }

    function renderOrders(orders) {
      const tbody = $('#tb-order tbody');
      tbody.empty();

      orders.forEach((o, i) => {
        const date = moment(o.createdAt).format('HH:mm DD/MM/YYYY');
        const pickDate = moment(o.pickTime).format('HH:mm DD/MM/YYYY');

        let statusClass = 'status-pending';
        if (o.orderStatus === 'Đã xác nhận') statusClass = 'status-confirmed';
        if (o.orderStatus === 'Đã hoàn thành') statusClass = 'status-completed';
        if (o.orderStatus === 'Đã hủy') statusClass = 'status-cancelled';

        const row = $(`
                    <tr>
                        <td>${i + 1}</td>
                        <td class="order-id">#${o.orderId}</td>
                        <td>
                            <div class="customer-info">
                                <div class="font-weight-bold">${o.phoneNumber}</div>
                                <div class="text-muted"><i class="far fa-calendar-alt mr-1"></i>${date}</div>
                            </div>
                        </td>
                        <td>
                            <div class="font-weight-bold text-dark">${o.productName}</div>
                            <div class="small text-muted">${o.pickUpAddress} &rarr; ${o.destinationAddress}</div>
                            <div class="small text-info"><i class="far fa-clock mr-1"></i>Hẹn lúc: ${pickDate}</div>
                        </td>
                        <td>
                            <div class="price-text">${o.totalPrice.toLocaleString()}đ</div>
                            <div class="small text-muted">Số lượng: ${o.quantity}</div>
                        </td>
                        <td><span class="status-badge ${statusClass}">${o.orderStatus}</span></td>
                        <td>
                            <button class="btn btn-outline-primary btn-sm px-3" onclick="showOrderDetails(${o.orderId})">Chi tiết</button>
                            
                            <!-- Detail Modal Placeholder -->
                            <div id="frmDatVe${o.orderId}" class="frmDatVe-modal">
                                <div class="modal-dialog modal-lg">
                                    <div class="modal-content">
                                        <form action="/management/my-store/${o.orderId}/except" method="post" class="p-4">
                                            <h4 class="mb-4 font-weight-bold text-primary">Chi tiết Đơn hàng #${o.orderId}</h4>
                                            <div class="row">
                                                <div class="col-md-6">
                                                    <p><strong>Khách hàng:</strong> ${o.phoneNumber}</p>
                                                    <p><strong>Điểm đón:</strong> ${o.pickUpAddress}</p>
                                                    <p><strong>Điểm trả:</strong> ${o.destinationAddress}</p>
                                                </div>
                                                <div class="col-md-6">
                                                    <p><strong>Thời gian đón:</strong> ${pickDate}</p>
                                                    <p><strong>Lời nhắn:</strong> ${o.message || 'Không có'}</p>
                                                    <p><strong>Trạng thái:</strong> <span class="badge badge-info">${o.orderStatus}</span></p>
                                                </div>
                                            </div>
                                            <hr>
                                            <div class="form-group">
                                                <label>Tổng tiền cần thu (VNĐ)</label>
                                                <input type="number" name="totalPrice" class="form-control" value="${o.totalPrice}" ${o.orderStatus !== 'Chờ xác nhận' ? 'readonly' : ''}>
                                            </div>
                                            <input type="hidden" name="orderAction" id="action${o.orderId}" value="Xác nhận">
                                            
                                            <div class="d-flex justify-content-end mt-4" style="gap: 10px;">
                                                ${o.orderStatus === 'Chờ xác nhận' ? `
                                                    <button type="submit" class="btn btn-primary" onclick="$('#action${o.orderId}').val('Xác nhận')">XÁC NHẬN ĐƠN</button>
                                                    <button type="submit" class="btn btn-danger" onclick="$('#action${o.orderId}').val('Hủy')">HỦY ĐƠN</button>
                                                ` : ''}
                                                ${o.orderStatus === 'Đã xác nhận' ? `
                                                    <button type="submit" class="btn btn-success" onclick="$('#action${o.orderId}').val('Hoàn thành')">HOÀN THÀNH</button>
                                                    <button type="submit" class="btn btn-danger" onclick="$('#action${o.orderId}').val('Hủy')">HỦY ĐƠN</button>
                                                ` : ''}
                                                <button type="button" class="btn btn-light" onclick="hideOrderDetails(${o.orderId})">ĐÓNG</button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </td>
                    </tr>
                `);
        tbody.append(row);
      });
    }

    window.showOrderDetails = id => $(`#frmDatVe${id}`).fadeIn(200);
    window.hideOrderDetails = id => $(`#frmDatVe${id}`).fadeOut(150);
  </script>
</body>

</html>
