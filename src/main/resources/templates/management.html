<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản trị Hệ thống - TransitBooking</title>

    <link rel="stylesheet" th:href="@{/webjars/bootstrap/4.6.2/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">

    <style>
        /* Specific module styles moved here for SPA efficiency */
        .product-img {
            width: 45px;
            height: 45px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        .route-info {
            display: flex;
            flex-direction: column;
        }

        .route-main {
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 2px;
        }

        .route-sub {
            color: #888;
            font-size: 0.8rem;
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .status-pending {
            background: #fffbe6;
            color: #faad14;
            border: 1px solid #ffe58f;
        }

        .status-confirmed {
            background: #e6f7ff;
            color: #1890ff;
            border: 1px solid #91d5ff;
        }

        .status-completed {
            background: #f6ffed;
            color: #52c41a;
            border: 1px solid #b7eb8f;
        }

        .status-cancelled {
            background: #fff1f0;
            color: #f5222d;
            border: 1px solid #ffa39e;
        }

        .notice-title {
            font-weight: 700;
            color: #2c3e50;
        }

        .status-active {
            color: var(--success);
            font-weight: 600;
        }

        .status-expired {
            color: var(--danger);
            font-weight: 600;
        }

        .profile-header {
            background: linear-gradient(135deg, var(--primary), #1e3c72);
            height: 100px;
            border-radius: 15px 15px 0 0;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid white;
            margin-top: -50px;
            background: white;
        }

        /* Loading overlay */
        #spa-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div th:replace="~{fragments/header}"></div>
    <div id="spa-loader">
        <div class="spinner-border text-primary"></div>
    </div>

    <div class="dashboard-wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar('products')}"></div>

        <main class="main-content" id="main-content-area">
            <!-- Dynamic Content Injected Here -->
            <div class="text-center py-5">
                <div class="spinner-border text-primary mb-3"></div>
                <p>Khởi tạo hệ thống quản trị...</p>
            </div>
        </main>
    </div>

    <!-- Modals (Global Container) -->
    <div id="modal-container"></div>

    <div th:replace="~{fragments/common-scripts :: commonScripts}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/management.js}"></script>
</body>

</html>
