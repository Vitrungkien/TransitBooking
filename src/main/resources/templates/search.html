<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kết quả tìm kiếm - TransitBooking</title>

  <!-- CSS Dependencies -->
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/4.6.2/css/bootstrap.min.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.0/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/lib/toastr.min.css}" />
  <link rel="stylesheet" th:href="@{/css/header.css}">
  <link rel="stylesheet" th:href="@{/css/home.css}">

  <style>
    :root {
      --primary-blue: #2474E5;
      --accent-yellow: #FFD333;
    }

    body {
      background: #f4f7f6;
      font-family: 'Segoe UI', sans-serif;
    }

    .page-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .main-content {
      flex: 1;
      padding: 40px 0;
    }

    .sidebar-card {
      border: none;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    .sidebar-header {
      border-bottom: 2px solid #f0f0f0;
      padding-bottom: 12px;
      color: var(--primary-blue);
      font-weight: 700;
    }

    .search-mini-box {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
    }
  </style>
</head>

<body class="page-wrapper">
  <div th:replace="~{fragments/header}"></div>

  <main class="main-content">
    <div class="container">
      <div class="row">
        <!-- Sidebars (same as main) -->
        <aside class="col-lg-3 d-none d-lg-block">
          <div class="card sidebar-card mb-4 p-4 sticky-top" style="top: 20px;">
            <h5 class="sidebar-header mb-4 text-uppercase text-center">Tuyến xe hot</h5>
            <div id="nha-xe" style="max-height: 60vh; overflow-y: auto;"></div>
          </div>
        </aside>

        <section class="col-lg-6 px-md-4">
          <!-- Mini Search Header -->
          <div class="search-mini-box">
            <form th:action="@{/search-by-stop}" method="get" class="row">
              <div class="col-12 mb-3">
                <label class="small font-weight-bold text-muted">TÌM KIẾM NHANH</label>
                <input type="text" name="keyword" class="form-control" placeholder="Tên nhà xe, địa chỉ..."
                  th:value="${searchByKeywordRq?.keyword}">
              </div>
              <div class="col-12"><button type="submit" class="btn btn-primary d-block w-100 font-weight-bold">TÌM
                  KIẾM</button></div>
            </form>
          </div>

          <h5 class="mb-4 font-weight-bold"><i class="fas fa-search text-primary mr-2"></i> Kết quả tìm kiếm cho bạn
          </h5>

          <div id="productList">
            <!-- Empty state handled by main.js if products length is 0 -->
          </div>

          <div id="pagination" class="mt-4 text-center"></div>
        </section>

        <aside class="col-lg-3 d-none d-lg-block">
          <div class="card sidebar-card mb-4 p-4 sticky-top" style="top: 20px;">
            <h5 class="sidebar-header mb-4 text-uppercase text-center">Thông báo mới</h5>
            <div id="all-notice" style="max-height: 60vh;"></div>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <footer class="bg-white border-top py-5 text-center mt-auto">
    <div class="container text-muted small font-weight-bold">
      TransitBooking &copy; 2023 - Đồ án tốt nghiệp Vi Trung Kiên
    </div>
  </footer>

  <!-- Global Scripts -->
  <div th:replace="~{fragments/common-scripts :: commonScripts}"></div>
  <script th:src="@{/js/main.js}"></script>
  <script th:inline="javascript">
    const isSearchPage = true;
    $(document).ready(function () {
      const initialProducts = /*[[${products}]]*/[];
      initWithProducts(initialProducts);

      // Still load notices and stores for sidebars
      ApiService.get(API_ENDPOINTS.HOME.NOTICE.ALL).then(renderAllNotices);
      ApiService.get(API_ENDPOINTS.HOME.STORE.ALL_STORE_NAME).then(renderStoreNames);
    });
  </script>
  <script th:src="@{/webjars/bootstrap/4.6.2/js/bootstrap.bundle.min.js}"></script>
</body>

</html>
