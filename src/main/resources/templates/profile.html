<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hồ sơ cá nhân - TransitBooking</title>

  <link rel="stylesheet" th:href="@{/webjars/bootstrap/4.6.2/css/bootstrap.min.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.0/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/admin.css}">
  <link rel="stylesheet" th:href="@{/css/header.css}">

  <style>
    .profile-card {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
    }

    .profile-header {
      background: linear-gradient(135deg, var(--primary), #1e3c72);
      height: 120px;
    }

    .profile-avatar-wrapper {
      margin-top: -60px;
      padding: 0 30px;
    }

    .profile-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 5px solid white;
      object-fit: cover;
      background: white;
    }

    .info-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      color: #888;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .info-value {
      font-size: 1.1rem;
      color: #2c3e50;
      font-weight: 600;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>
  <div th:replace="~{fragments/header}"></div>

  <div class="dashboard-wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar('profile')}"></div>

    <main class="main-content">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="font-weight-bold mb-0">Hồ sơ Cửa hàng</h2>
          <p class="text-muted mb-0">Quản lý thông tin tài khoản và đối tác</p>
        </div>
      </div>

      <div class="row">
        <div class="col-lg-4">
          <div class="profile-card mb-4 text-center pb-4">
            <div class="profile-header"></div>
            <div class="profile-avatar-wrapper mb-3">
              <img src="/img/user.png" alt="User" class="profile-avatar shadow">
            </div>
            <h4 id="display-name" class="font-weight-bold mb-1">...</h4>
            <p id="display-role" class="badge badge-primary px-3 py-2">...</p>
            <hr class="mx-4">
            <div class="px-4 text-left">
              <p class="small text-muted mb-0">Thành viên từ:</p>
              <p id="display-created-at" class="font-weight-bold">...</p>
            </div>
          </div>
        </div>

        <div class="col-lg-8">
          <div class="content-card">
            <div class="card-header">
              <h5 class="card-title">Thông tin chi tiết</h5>
            </div>
            <div class="card-body p-4">
              <div class="row">
                <div class="col-md-6">
                  <p class="info-label">Mã tài khoản</p>
                  <p id="user-id" class="info-value">#...</p>

                  <p class="info-label">Họ và tên</p>
                  <p id="full-name" class="info-value">...</p>

                  <p class="info-label">Email liên hệ</p>
                  <p id="email" class="info-value">...</p>
                </div>
                <div class="col-md-6">
                  <p class="info-label">Số điện thoại</p>
                  <p id="phone-number" class="info-value">...</p>

                  <p class="info-label">Vai trò hệ thống</p>
                  <p id="role" class="info-value">...</p>

                  <p class="info-label">Trạng thái</p>
                  <p class="info-value text-success">Đang hoạt động</p>
                </div>
              </div>
              <hr>
              <div class="d-flex justify-content-end">
                <button class="btn btn-outline-primary mr-2">Đổi mật khẩu</button>
                <button class="btn btn-primary px-4">Cập nhật thông tin</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div th:replace="~{fragments/common-scripts :: commonScripts}"></div>

  <script>
    $(document).ready(function () {
      ApiService.get('/api/v1/me')
        .then(data => {
          const fullName = data.firstName + ' ' + (data.lastName || '');
          const date = moment(data.createdAt).format('DD/MM/YYYY');

          $('#user-id').text('#' + data.userID);
          $('#display-name, #full-name').text(fullName);
          $('#display-role, #role').text(data.role);
          $('#email').text(data.email);
          $('#phone-number').text(data.phoneNumber);
          $('#display-created-at').text(date);
        })
        .catch(error => console.error('Error fetching data:', error));
    });
  </script>
</body>

</html>
