<div class="header shadow-sm">
    <div class="container d-flex justify-content-between align-items-center" style="height: 60px;">
        <div class="left-menu d-flex align-items-center">
            <a th:href="@{/}" class="d-flex align-items-center">
                <img th:src="@{/img/logo2.png}" alt="TransitBooking" style="height: 45px; width: auto;"
                    onerror="this.src='/img/fallback-logo.png'; this.style.background='#fff';">
            </a>
        </div>
        <ul class="right-menu mb-0 d-flex align-items-center">
            <li class="main-menu"><a class="main-menu-a py-2 font-weight-bold" th:href="@{/}">Trang chủ</a></li>
            <li class="main-menu d-none d-md-block"><a class="main-menu-a py-2 font-weight-bold" href="">Gửi hàng</a>
            </li>
            <li class="main-menu d-none d-md-block">
                <a class="main-menu-a py-2 font-weight-bold" href="">Thuê xe <i class="fas fa-caret-down small"></i></a>
                <ul class="sub-main-menu shadow">
                    <li>Hợp đồng du lịch</li>
                    <li>Thuê xe tự lái</li>
                </ul>
            </li>
            <li class="main-menu d-none d-lg-block"><a class="main-menu-a py-2 font-weight-bold" href="">Giới thiệu</a>
            </li>
            <li class="main-menu" id="me"
                th:if="${#authorization.expression('hasRole(''ADMIN'') or hasRole(''SELLER'') or hasRole(''USER'')')}">
                <a class="main-menu-a py-2 font-weight-bold" href="" style="color: #FFD333 !important;">
                    <i class="fas fa-user-circle mr-1"></i> Tôi
                </a>
                <ul class="sub-main-menu sub-main-menu-toi shadow">
                    <li><a th:href="@{/profile}">Tài khoản</a></li>
                    <div id="management"
                        th:if="${#authorization.expression('hasRole(''ADMIN'') or hasRole(''SELLER'')')}">
                        <li><a th:href="@{/management}">Trang quản trị</a></li>
                    </div>
                    <li th:if="${#authorization.expression('hasRole(''USER'')')}"><a th:href="@{/my-order}">Đơn hàng của
                            tôi</a></li>
                    <li id="logoutButton" class="border-top mt-1"><a href="" class="text-danger">Đăng xuất</a></li>
                </ul>
            </li>

            <li class="main-menu" id="login" th:unless="${#authorization.expression('isAuthenticated()')}">
                <a class="main-menu-a py-2 px-4 btn btn-warning font-weight-bold ml-3"
                    style="line-height: normal; border-radius: 20px; color: black !important;" th:href="@{/login}">
                    Đăng nhập
                </a>
            </li>
        </ul>
    </div>
</div>

<script>
    // Logout listener
    $(document).on('click', '#logoutButton', function (e) {
        e.preventDefault();
        if (typeof handleLogout === 'function') {
            handleLogout();
        } else {
            ApiService.post(API_ENDPOINTS.LOG_OUT)
                .then(response => {
                    if (response.ok) window.location.href = '/';
                });
        }
    });
</script>
