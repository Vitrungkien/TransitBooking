<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Thông báo - TransitBooking</title>

  <link rel="stylesheet" th:href="@{/webjars/bootstrap/4.6.2/css/bootstrap.min.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.0/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/admin.css}">
  <link rel="stylesheet" th:href="@{/css/header.css}">

  <style>
    .notice-card {
      border-left: 4px solid var(--primary);
      margin-bottom: 15px;
    }

    .notice-title {
      font-weight: 700;
      color: #2c3e50;
    }

    .notice-meta {
      font-size: 0.8rem;
      color: #888;
    }

    .status-active {
      color: var(--success);
      font-weight: 600;
    }

    .status-expired {
      color: var(--danger);
      font-weight: 600;
    }

    .update-notice-div {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1200;
    }

    .notice-form-card {
      background: white;
      border-radius: 15px;
      padding: 30px;
    }
  </style>
</head>

<body>
  <div th:replace="~{fragments/header}"></div>

  <div class="dashboard-wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar('notices')}"></div>

    <main class="main-content">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="font-weight-bold mb-0">Quản lý Thông báo</h2>
          <p class="text-muted mb-0">Gửi thông báo lộ trình đến hành khách</p>
        </div>
        <button class="btn btn-primary btn-lg shadow-sm" data-toggle="modal" data-target="#newNoticeModal"
          style="border-radius: 10px;">
          <i class="fas fa-plus mr-2"></i> TẠO THÔNG BÁO
        </button>
      </div>

      <div class="content-card">
        <div class="card-header">
          <h5 class="card-title">Lịch sử thông báo</h5>
        </div>
        <div class="table-responsive">
          <table class="table" id="tb-notice">
            <thead>
              <tr>
                <th style="width: 50px;">STT</th>
                <th>Thông tin vé</th>
                <th>Nội dung thông báo</th>
                <th>Thời gian tạo</th>
                <th>Trạng thái</th>
                <th>Thao tác</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td colspan="6" class="text-center py-5">
                  <div class="spinner-border text-primary mb-2"></div>
                  <p class="text-muted">Đang tải danh sách thông báo...</p>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- New Notice Modal -->
  <div class="modal fade" id="newNoticeModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content notice-form-card">
        <form action="/management/my-store/create-notice" method="post">
          <h4 class="font-weight-bold text-primary mb-4">Tạo Thông báo mới</h4>
          <div class="form-group">
            <label class="font-weight-bold">Tiêu đề</label>
            <input type="text" name="title" class="form-control" placeholder="Ví dụ: Xe sắp đến điểm đón" required>
          </div>
          <div class="form-group">
            <label class="font-weight-bold">Nội dung chi tiết</label>
            <textarea name="content" class="form-control" rows="3" placeholder="Nhập lời nhắn gửi đến khách hàng..."
              required></textarea>
          </div>
          <div class="form-group">
            <label class="font-weight-bold">Chọn Chuyến xe áp dụng</label>
            <select name="productID" id="productID-option" class="form-control" required>
              <option value="">Đang tải danh sách chuyến xe...</option>
            </select>
          </div>
          <div class="d-flex justify-content-end mt-4" style="gap: 10px;">
            <button type="submit" class="btn btn-primary px-4 font-weight-bold">GỬI THÔNG BÁO</button>
            <button type="button" class="btn btn-light" data-dismiss="modal">HỦY</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div th:replace="~{fragments/common-scripts :: commonScripts}"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

  <script th:inline="javascript">
    $(document).ready(function () {
      loadNotices();
      loadProductsForSelect();
    });

    function loadNotices() {
      ApiService.get('/api/v1/seller/my-store/all-notices')
        .then(notices => renderNotices(notices))
        .catch(err => {
          console.error(err);
          $('#tb-notice tbody').html('<tr><td colspan="6" class="text-center p-5 text-danger">Lỗi tải thông báo.</td></tr>');
        });
    }

    function loadProductsForSelect() {
      ApiService.get('/api/v1/seller/my-store/all-product')
        .then(products => {
          const select = $('#productID-option');
          select.empty().append('<option value="">-- Chọn chuyến xe --</option>');
          products.forEach(p => {
            const time = formatTime(p.startTime);
            select.append(`<option value="${p.productId}">${p.productName} (${time}) - ${p.bienSoXe || 'No BS'}</option>`);
          });
        });
    }

    function renderNotices(notices) {
      const tbody = $('#tb-notice tbody');
      tbody.empty();

      if (!notices || notices.length === 0) {
        tbody.append('<tr><td colspan="6" class="text-center p-5 text-muted">Chưa có thông báo nào được gửi.</td></tr>');
        return;
      }

      notices.forEach((n, i) => {
        const date = moment(n.createdAt).format('HH:mm DD/MM/YYYY');
        const statusText = n.expired ? 'Hết hiệu lực' : 'Đang hiển thị';
        const statusClass = n.expired ? 'status-expired' : 'status-active';

        const row = $(`
                    <tr style="${!n.expired ? 'background: #f6ffed;' : ''}">
                        <td class="text-muted font-weight-bold">${i + 1}</td>
                        <td>
                            <div class="font-weight-bold text-dark">${n.productName}</div>
                            <div class="small text-muted"><i class="fas fa-bus mr-1"></i>${n.bienSoXe || ''}</div>
                        </td>
                        <td>
                            <div class="notice-title">${n.title}</div>
                            <div class="small text-muted text-truncate" style="max-width: 300px;">${n.content}</div>
                        </td>
                        <td><small class="text-muted">${date}</small></td>
                        <td><span class="${statusClass}">${statusText}</span></td>
                        <td>
                            <button class="btn btn-outline-primary btn-sm" onclick="openUpdateNotice(${n.noticeId})">Sửa</button>
                            
                            <div id="update-notice-frm${n.noticeId}" class="update-notice-div">
                                <div class="modal-dialog">
                                    <div class="modal-content notice-form-card">
                                        <form action="/management/my-store/update-notice" method="post">
                                            <h4 class="font-weight-bold text-primary mb-4">Sửa Thông báo #${n.noticeId}</h4>
                                            <input type="hidden" name="noticeID" value="${n.noticeId}">
                                            <div class="form-group"><label>Tiêu đề</label><input type="text" name="title" class="form-control" value="${n.title}" required></div>
                                            <div class="form-group"><label>Nội dung</label><textarea name="content" class="form-control" rows="3" required>${n.content}</textarea></div>
                                            <div class="form-group">
                                                <label>Trạng thái hiệu lực</label>
                                                <select name="expired" class="form-control">
                                                    <option value="false" ${!n.expired ? 'selected' : ''}>Còn hiệu lực</option>
                                                    <option value="true" ${n.expired ? 'selected' : ''}>Hết hiệu lực</option>
                                                </select>
                                            </div>
                                            <div class="d-flex justify-content-end mt-4" style="gap: 10px;">
                                                <button type="submit" class="btn btn-primary px-4 font-weight-bold">CẬP NHẬT</button>
                                                <button type="button" class="btn btn-light" onclick="closeUpdateNotice(${n.noticeId})">HỦY</button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </td>
                    </tr>
                `);
        tbody.append(row);
      });
    }

    window.openUpdateNotice = id => $(`#update-notice-frm${id}`).fadeIn(200);
    window.closeUpdateNotice = id => $(`#update-notice-frm${id}`).fadeOut(150);
  </script>
</body>

</html>
