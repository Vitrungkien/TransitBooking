<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cập nhật Chuyến xe - TransitBooking</title>

    <link rel="stylesheet" th:href="@{/webjars/bootstrap/4.6.2/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">

    <style>
        .form-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
            margin-bottom: 25px;
        }

        .section-title {
            font-weight: 700;
            color: var(--primary);
            border-left: 4px solid var(--primary);
            padding-left: 15px;
            margin-bottom: 20px;
        }

        .stop-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            border: 1px solid #eee;
        }

        .ck-editor__editable {
            min-height: 200px;
        }
    </style>
</head>

<body>
    <div th:replace="~{fragments/header}"></div>

    <div class="dashboard-wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar('products')}"></div>

        <main class="main-content">
            <div id="loading" class="text-center py-5">
                <div class="spinner-border text-primary"></div>
                <p class="mt-2 text-muted">Đang tải thông tin chuyến xe...</p>
            </div>

            <div id="productUpdateForm" style="display: none;">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="font-weight-bold mb-0">Cập nhật Chuyến xe</h2>
                    <a th:href="@{/management}" class="btn btn-light"><i class="fas fa-arrow-left mr-2"></i> QUAY
                        LẠI</a>
                </div>

                <div id="formContainer"></div>
            </div>
        </main>
    </div>

    <div th:replace="~{fragments/common-scripts :: commonScripts}"></div>
    <script src="https://cdn.ckeditor.com/ckeditor5/40.2.0/classic/ckeditor.js"></script>

    <script th:inline="javascript">
        let stopCount = 0;
        const currentUrl = window.location.href;
        const productIdMatch = currentUrl.match(/\/management\/(\d+)\/update-product/);
        const productId = productIdMatch[1];

        $(document).ready(function () {
            loadProductData();
        });

        function loadProductData() {
            ApiService.get(API_ENDPOINTS.MY.PRODUCT.DETAIL(productId))
                .then(product => {
                    $('#loading').hide();
                    $('#productUpdateForm').show();
                    renderForm(product);
                })
                .catch(err => {
                    console.error(err);
                    $('#loading').html('<div class="alert alert-danger">Không thể tải dữ liệu. Vui lòng kiểm tra lại ID chuyến xe.</div>');
                });
        }

        function renderForm(p) {
            const container = $('#formContainer');
            const html = `
                <form action="/management/my-store/${p.productID}/update-product" method="post">
                    <div class="row">
                        <div class="col-lg-8">
                            <!-- Basic Info -->
                            <div class="form-section">
                                <h5 class="section-title">THÔNG TIN CHUNG</h5>
                                <div class="form-group"><label>Tên chuyến xe</label><input type="text" name="productName" class="form-control" value="${p.productName}" required></div>
                                <div class="row">
                                    <div class="col-md-6"><div class="form-group"><label>Loại xe</label><input type="text" name="type" class="form-control" value="${p.type}" required></div></div>
                                    <div class="col-md-6"><div class="form-group"><label>Biển số</label><input type="text" name="bienSoXe" class="form-control" value="${p.bienSoXe || ''}"></div></div>
                                </div>
                                <div class="row">
                                    <div class="col-md-4"><div class="form-group"><label>Giá vé (VNĐ)</label><input type="number" name="price" class="form-control" value="${p.price}" required></div></div>
                                    <div class="col-md-4"><div class="form-group"><label>Chỗ trống</label><input type="number" name="remainSeat" class="form-control" value="${p.remainSeat}" required></div></div>
                                    <div class="col-md-4"><div class="form-group"><label>Hình ảnh (URL)</label><input type="text" name="productImage" class="form-control" value="${p.productImage || ''}"></div></div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6"><div class="form-group"><label>SĐT 1</label><input type="text" name="phoneNumber" class="form-control" value="${p.phoneNumber}" required></div></div>
                                    <div class="col-md-6"><div class="form-group"><label>SĐT 2</label><input type="text" name="phoneNumber2" class="form-control" value="${p.phoneNumber2 || ''}"></div></div>
                                </div>
                            </div>

                            <!-- Route Info -->
                            <div class="form-section">
                                <h5 class="section-title">LỊCH TRÌNH CHÍNH</h5>
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="form-group"><label>Điểm bắt đầu</label><input type="text" name="startAddress" class="form-control" value="${p.startAddress}" required></div>
                                        <div class="form-group"><label>Giờ xuất phát</label><input type="time" name="startTime" class="form-control" value="${p.startTime}" required></div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-group"><label>Điểm kết thúc</label><input type="text" name="endAddress" class="form-control" value="${p.endAddress}" required></div>
                                        <div class="form-group"><label>Giờ đến dự kiến</label><input type="time" name="endTime" class="form-control" value="${p.endTime || ''}"></div>
                                    </div>
                                </div>
                            </div>

                            <!-- Detailed Stops -->
                            <div class="form-section">
                                <h5 class="section-title">ĐIỂM DỪNG TIẾP NHẬN</h5>
                                <div id="stopList"></div>
                                <button type="button" class="btn btn-outline-primary btn-block mt-3" onclick="addStop()"><i class="fas fa-plus mr-2"></i> THÊM ĐIỂM DỪNG</button>
                            </div>
                        </div>

                        <div class="col-lg-4">
                            <!-- Policy & Description -->
                            <div class="form-section">
                                <h5 class="section-title">NỘI DUNG CHI TIẾT</h5>
                                <div class="form-group"><label>Mô tả</label><textarea id="descEditor" name="description">${p.description || ''}</textarea></div>
                                <div class="form-group"><label>Chính sách</label><textarea id="policyEditor" name="policy">${p.policy || ''}</textarea></div>
                                <div class="form-group"><label>Tiện ích</label><textarea id="utilEditor" name="tienIch">${p.tienIch || ''}</textarea></div>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg btn-block shadow-sm">LƯU THAY ĐỔI</button>
                            <a href="/management" class="btn btn-light btn-block mt-2">HỦY BỎ</a>
                        </div>
                    </div>
                </form>
            `;
            container.html(html);

            // Init Editors
            ClassicEditor.create(document.querySelector('#descEditor')).catch(console.error);
            ClassicEditor.create(document.querySelector('#policyEditor')).catch(console.error);
            ClassicEditor.create(document.querySelector('#utilEditor')).catch(console.error);

            // Load Existing Stops
            if (p.stopList && p.stopList.length > 0) {
                p.stopList.forEach(s => addStop(s));
            }
        }

        function addStop(data = null) {
            const stopList = $('#stopList');
            const id = stopCount++;
            const stopHtml = `
                <div class="stop-item" id="stop-at-${id}">
                    <div class="row align-items-end">
                        <input type="hidden" name="stopList[${id}].stopId" value="${data ? data.stopId : '-1'}">
                        <div class="col-md-7">
                            <label class="small font-weight-bold">Địa chỉ dừng</label>
                            <input type="text" name="stopList[${id}].stopAddress" class="form-control form-control-sm" value="${data ? data.stopAddress : ''}" required>
                        </div>
                        <div class="col-md-3">
                            <label class="small font-weight-bold">Giờ</label>
                            <input type="time" name="stopList[${id}].stopTime" class="form-control form-control-sm" value="${data ? data.stopTime : ''}" required>
                        </div>
                        <div class="col-md-2 text-right">
                            <button type="button" class="btn btn-sm btn-danger" onclick="removeStop(${id})"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                </div>
            `;
            stopList.append(stopHtml);
        }

        function removeStop(id) {
            $(`#stop-at-${id}`).remove();
            // Re-indexing logic for Spring binding if necessary, though simple removal often works for new lists
        }
    </script>
</body>

</html>
